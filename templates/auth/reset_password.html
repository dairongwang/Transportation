{% extends "base.html" %}
{% block title %}Choose a new password - ServiceUber{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h2>Choose a new password</h2>
        <p class="text-muted">Account: <strong>{{ user.username }}</strong></p>
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label" for="new_password">New password <small class="text-muted">(min {{ config.PASSWORD_MIN_LENGTH }} characters)</small></label>
                <input type="password" id="new_password" name="new_password" class="form-control" required minlength="{{ config.PASSWORD_MIN_LENGTH }}" autocomplete="new-password" autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label" for="confirm_password">Confirm new password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary">Set new password</button>
        </form>
        <p class="small text-muted mt-3">All other sessions and remembered devices will be signed out.</p>
    </div>
</div>
{% endblock %}
