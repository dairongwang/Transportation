{# Shown only when the given channel is served by a fake backend. `channel` = 'email' | 'sms' #}
{% set hint = stub_hint(channel) %}
{% if hint %}
<div class="alert alert-warning small py-2" role="note">
    <strong>Where is my {{ 'e-mail' if channel == 'email' else 'SMS' }}?</strong> {{ hint }}
    {% if config.ENABLE_DEV_TOOLS %}<a class="alert-link" href="{{ url_for('dev.outbox') }}" target="_blank">Open fake inbox</a>{% endif %}
</div>
{% endif %}
