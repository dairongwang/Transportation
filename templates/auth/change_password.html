{% extends "base.html" %}
{% block title %}Change password - ServiceUber{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h2>Change password</h2>
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label" for="current_password">Current password</label>
                <input type="password" id="current_password" name="current_password" class="form-control" required autocomplete="current-password">
            </div>
            <div class="mb-3">
                <label class="form-label" for="new_password">New password <small class="text-muted">(min {{ config.PASSWORD_MIN_LENGTH }} characters)</small></label>
                <input type="password" id="new_password" name="new_password" class="form-control" required minlength="{{ config.PASSWORD_MIN_LENGTH }}" autocomplete="new-password">
            </div>
            <div class="mb-3">
                <label class="form-label" for="confirm_password">Confirm new password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary">Update password</button>
            <a href="{{ url_for('auth.security') }}" class="btn btn-link">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
