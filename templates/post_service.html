{% extends "base.html" %}
{% block title %}Post Service - ServiceUber{% endblock %}
{% block content %}
<h2>Post a New Service</h2>
<form method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
        <label class="form-label">Title</label>
        <input type="text" name="title" class="form-control" required placeholder="e.g. Airport Transfer">
    </div>
    <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="3"></textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">Category</label>
        <select name="category" class="form-select">
            <option value="ride">Ride / Transport</option>
            <option value="delivery">Delivery</option>
            <option value="cleaning">Cleaning</option>
            <option value="tutoring">Tutoring</option>
            <option value="handyman">Handyman</option>
            <option value="other">Other</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Price ($)</label>
        <input type="number" step="0.01" name="price" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Location</label>
        <input type="text" name="location" class="form-control" placeholder="City or area">
    </div>
    <button type="submit" class="btn btn-success">Post Service</button>
</form>
{% endblock %}
