{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="alert alert-danger mt-3">
    <h4 class="alert-heading">{{ title }}</h4>
    <p class="mb-0">{{ message }}</p>
    {% if hint %}<hr><p class="mb-0 small">{{ hint }}</p>{% endif %}
</div>
<a href="{{ url_for('views.dashboard') }}">Back to the dashboard</a>
{% endblock %}
