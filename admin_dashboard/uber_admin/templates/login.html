{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <h2 class="mt-3">Manager sign-in</h2>
        {% if config.SEED_DEMO_USERS %}<p class="small text-muted">Development (DUMMY): dummy_manager / dummyManagerPass123 (decides) ·
            dummy_viewer / dummyViewerPass123 (read-only)</p>{% endif %}
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3"><label class="form-label" for="username">Username</label>
                <input id="username" name="username" class="form-control" required autocomplete="username" autofocus></div>
            <div class="mb-3"><label class="form-label" for="password">Password</label>
                <input id="password" name="password" type="password" class="form-control" required autocomplete="current-password"></div>
            <button class="btn btn-primary">Sign in</button>
        </form>
    </div>
</div>
{% endblock %}
